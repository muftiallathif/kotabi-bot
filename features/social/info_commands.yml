cara-naik-rank: |
  Untuk naik kasta, pergi ke saluran <#1517023518984896564> (quiz-rank-up). Saluran ini SATU-SATUNYA yang dapat digunakan untuk naik kasta.
  Lalu gunakan perintah `/list_role_commands` untuk melihat kuis yang tersedia dan perintah yang harus digunakan.
  Saluran <#1522435952776183949> (quiz-public-forum) hanya untuk kuis biasa, latihan, atau duel bersama teman—bersenang-senang saja, TIDAK akan menaikkan kasta Anda.

panduan-belajar: |
  Mulai perjalanan belajar Bahasa Jepangmu di Kotabi Japanese!
  1. Pelajari Hiragana & Katakana terlebih dahulu.
  2. Ambil kuis kasta untuk naik kasta.
  3. Ikuti kelas intensif untuk bimbingan personal.
  Semangat! 頑張ってください！

kelas-intensif: |
  Kelas Intensif Kotabi Japanese
  Paket belajar terbimbing untuk topik tertentu (mis. JLPT N5/N4, Kaiwa), yang
  memberikan akses Companion untuk durasi lebih panjang selama masa kelas.
  Detail biaya, jadwal, dan silabus tiap kelas bisa berbeda-beda — silakan
  hubungi admin untuk info kelas yang sedang dibuka dan harga terbarunya!

member-reguler: |
  Paket Membership Kotabi Japanese

