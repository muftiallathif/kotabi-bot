  Lalu gunakan perintah `/list_role_commands` untuk melihat kuis yang tersedia dan perintah yang harus digunakan.
  Saluran <#1404383455898501204>, <#1516017411231580200>, dan <#1517023365947199508> (quiz-public) hanya untuk kuis biasa, latihan, atau duel bersama teman—bersenang-senang saja, TIDAK akan menaikkan kasta Anda.

