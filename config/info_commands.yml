cara-naik-rank: |
  Untuk naik rank, pergi ke channel <#1517023518984896564> (quiz-rank-up). Channel ini SATU-SATUNYA channel yang bisa dipakai untuk naik level.
  Lalu gunakan command `/list_role_commands` untuk melihat quiz yang tersedia dan command yang harus dipakai.
  Channel <#1404383455898501204>, <#1516017411231580200>, dan <#1517023365947199508> (quiz-public) hanya untuk quiz biasa, latihan, atau duel sama teman — have fun aja, TIDAK akan menaikkan rank kamu.

